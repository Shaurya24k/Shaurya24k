<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img"><style>
text{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.serif{font-family:'Instrument Serif', Georgia, 'Times New Roman', serif}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes swing{0%{opacity:0;transform:translateY(40px) rotate(-4deg)}70%{transform:translateY(-4px) rotate(1deg)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.fb{transform-box:fill-box}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.grow{transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.pop{transform-origin:center;animation:pop .35s ease-out both}
.swing{transform-origin:center bottom;animation:swing .9s cubic-bezier(.2,.7,.2,1) both}
.pulse{animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="840" height="250" rx="14" fill="#f4f3ee" stroke="#e2e0d8"/>
<circle cx="36" cy="38" r="4" fill="#2b4bff" class="pulse"/>
<text x="48" y="42" font-size="11" letter-spacing="1.5" fill="#8a8a85" class="rise" style="animation-delay:0.00s">B.TECH CSE · FULL STACK &amp; APPLIED AI</text>
<defs><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#161616"/><stop offset=".45" stop-color="#161616"/>
<stop offset=".5" stop-color="#2b4bff"/><stop offset=".55" stop-color="#161616"/><stop offset="1" stop-color="#161616"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" begin="1.4s;sw.end+4s" id="sw" fill="freeze"/>
</linearGradient></defs>
<text x="36" y="132" font-size="78" class="serif rise" fill="#161616" style="animation-delay:0.15s">Shaurya</text>
<text x="36" y="206" font-size="78" font-style="italic" class="serif rise" fill="url(#sh)" style="animation-delay:0.35s">Sinha</text>
<g class="rise" style="animation-delay:0.60s">
<text x="470" y="120" font-size="15" fill="#161616">I build India-first products,</text>
<text x="470" y="144" font-size="15" fill="#161616">ship fast, and learn in public.</text>
<text x="470" y="190" font-size="12" fill="#2b4bff">github.com/Shaurya24k ↗</text></g></svg>