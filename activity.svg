<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img"><style>
text{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.serif{font-family:'Instrument Serif', Georgia, 'Times New Roman', serif}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes swing{0%{opacity:0;transform:translateY(40px) rotate(-4deg)}70%{transform:translateY(-4px) rotate(1deg)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.fb{transform-box:fill-box}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.grow{transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.pop{transform-origin:center;animation:pop .35s ease-out both}
.swing{transform-origin:center bottom;animation:swing .9s cubic-bezier(.2,.7,.2,1) both}
.pulse{animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="840" height="250" rx="14" fill="#f4f3ee" stroke="#e2e0d8"/>
<text x="36" y="38" font-size="10" letter-spacing="1.5" fill="#8a8a85">THE LAST 12 MONTHS ON GITHUB</text>
<text x="36" y="84" font-size="44" class="serif rise" fill="#161616">1,058 <tspan font-style="italic">contributions</tspan></text>
<rect class="grow fb" style="animation-delay:0.30s" x="36" y="122.2" width="36" height="73.8" rx="3" fill="#161616"/><text x="54.0" y="214" font-size="10" fill="#8a8a85" text-anchor="middle">Dec</text><rect class="grow fb" style="animation-delay:0.35s" x="84" y="136.2" width="36" height="59.8" rx="3" fill="#161616"/><text x="102.0" y="214" font-size="10" fill="#8a8a85" text-anchor="middle">Jan</text><rect class="grow fb" style="animation-delay:0.40s" x="132" y="137.7" width="36" height="58.3" rx="3" fill="#161616"/><text x="150.0" y="214" font-size="10" fill="#8a8a85" text-anchor="middle">Feb</text><rect class="grow fb" style="animation-delay:0.45s" x="180" y="86.0" width="36" height="110.0" rx="3" fill="#2b4bff"/><text x="198.0" y="214" font-size="10" fill="#8a8a85" text-anchor="middle">Mar</text><text class="rise" style="animation-delay:1.00s" x="198.0" y="78.0" font-size="11" fill="#2b4bff" text-anchor="middle">149</text><rect class="grow fb" style="animation-delay:0.50s" x="228" y="127.3" width="36" height="68.7" rx="3" fill="#161616"/><text x="246.0" y="214" font-size="10" fill="#8a8a85" text-anchor="middle">Apr</text><rect class="grow fb" style="animation-delay:0.55s" x="276" y="134.7" width="36" height="61.3" rx="3" fill="#161616"/><text x="294.0" y="214" font-size="10" fill="#8a8a85" text-anchor="middle">May</text><rect class="grow fb" style="animation-delay:0.60s" x="324" y="145.8" width="36" height="50.2" rx="3" fill="#161616"/><text x="342.0" y="214" font-size="10" fill="#8a8a85" text-anchor="middle">Jun</text><rect class="grow fb" style="animation-delay:0.65s" x="372" y="151.0" width="36" height="45.0" rx="3" fill="#161616"/><text x="390.0" y="214" font-size="10" fill="#8a8a85" text-anchor="middle">Jul</text><rect class="grow fb" style="animation-delay:0.70s" x="420" y="117.0" width="36" height="79.0" rx="3" fill="#161616"/><text x="438.0" y="214" font-size="10" fill="#8a8a85" text-anchor="middle">Aug</text><rect class="grow fb" style="animation-delay:0.75s" x="468" y="134.0" width="36" height="62.0" rx="3" fill="#161616"/><text x="486.0" y="214" font-size="10" fill="#8a8a85" text-anchor="middle">Sep</text><rect class="grow fb" style="animation-delay:0.80s" x="516" y="134.7" width="36" height="61.3" rx="3" fill="#161616"/><text x="534.0" y="214" font-size="10" fill="#8a8a85" text-anchor="middle">Oct</text><rect class="grow fb" style="animation-delay:0.85s" x="564" y="176.1" width="36" height="19.9" rx="3" fill="#161616"/><text x="582.0" y="214" font-size="10" fill="#8a8a85" text-anchor="middle">Nov</text>
<g class="rise" style="animation-delay:0.40s"><text x="650" y="88" font-size="34" class="serif" fill="#161616">1 <tspan font-style="italic">days</tspan></text><text x="650" y="106" font-size="10" fill="#8a8a85">current streak · longest 11</text></g>
<g class="rise" style="animation-delay:0.55s"><text x="650" y="146" font-size="34" class="serif" fill="#161616">187 <tspan fill="#8a8a85">/ 365</tspan></text><text x="650" y="164" font-size="10" fill="#8a8a85">days with a commit</text></g>
<g class="rise" style="animation-delay:0.70s"><text x="650" y="204" font-size="34" class="serif" fill="#161616">13</text><text x="650" y="222" font-size="10" fill="#8a8a85">on the busiest day</text></g></svg>